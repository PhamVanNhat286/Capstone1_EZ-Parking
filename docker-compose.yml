services:
  # ============================================================
  # Backend - Express.js API
  # Kết nối TRỰC TIẾP vào PostgreSQL trên máy của bạn (D:\postgresql)
  # ============================================================
  backend:
    build:
      context: ./backend
      target: production
    container_name: ezspace-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${PORT:-5000}
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      JWT_SECRET: ${JWT_SECRET:-ezspace_jwt_secret_capstone_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      NODE_ENV: production
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ezspace-network

  # ============================================================
  # Frontend - Next.js Customer App
  # ============================================================
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: ezspace-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ezspace-network

# ============================================================
# Networks
# ============================================================
networks:
  ezspace-network:
    driver: bridge
